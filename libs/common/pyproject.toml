[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketing-common"
version = "1.0.0"
description = "Shared infrastructure code for Ticketing microservices: logging, errors, health, security, messaging, outbox."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "prometheus-client>=0.20",
    "grpcio>=1.85.1",
    "protobuf>=7.36",
]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.setuptools.package-data]
common = ["protos/*.proto"]
