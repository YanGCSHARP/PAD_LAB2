global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: auth-service
    static_configs: [{targets: ["auth-service:8000"]}]
  - job_name: user-service
    static_configs: [{targets: ["user-service:8000"]}]
  - job_name: catalog-service
    static_configs: [{targets: ["catalog-service:8000"]}]
  - job_name: booking-service
    static_configs: [{targets: ["booking-service:8000"]}]
  - job_name: payment-service
    static_configs: [{targets: ["payment-service:8000"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:8000"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
